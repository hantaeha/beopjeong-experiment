name: Keep Streamlit Alive

on:
  schedule:
    # 2시간마다 자동 실행 (UTC 기준)
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive pings to multiple apps
        run: |
          # 운영 중인 다양한 서비스 URL 리스트
          urls=(
            "https://experiment-app-a.streamlit.app";
          )
          for url in "${urls[@]}"; do
            curl -s $url > /dev/null
            echo "Successfully pinged: $url"
          done
