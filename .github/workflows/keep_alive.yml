name: Keep Streamlit Apps Alive

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Ping Streamlit via Puppeteer
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            
            console.log('Visiting App A...');
            await page.goto('https://experiment-app-a.streamlit.app/', {waitUntil: 'networkidle2'});
            await new Promise(r => setTimeout(r, 5000));
            
            console.log('Visiting App B...');
            await page.goto('https://experiment-app-b.streamlit.app/', {waitUntil: 'networkidle2'});
            await new Promise(r => setTimeout(r, 5000));
            
            await browser.close();
            console.log('Done!');
          })();
          "
