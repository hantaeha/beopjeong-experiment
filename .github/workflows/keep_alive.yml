name: Keep Streamlit Apps Alive

on:
  schedule:
    # 3시간마다 실행 (Streamlit 휴면 방지)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Apps
        run: |
          curl -sS https://experiment-app-a.streamlit.app > /dev/null
          curl -sS https://experiment-app-b.streamlit.app > /dev/null
